# This is a plain static site — no build step needed.
[build]
  publish = "."
  command = ""

# Nicer URLs / SPA-safe admin (optional)
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Security headers — stop other sites from embedding your pages/images in a frame
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"

# NOTE: true image hotlink protection (blocking other websites from hot-linking your
# image URLs directly) is best done at the CDN level — e.g. Cloudflare → Scrape Shield →
# Hotlink Protection (free). Enable it there once your domain is on Cloudflare.
